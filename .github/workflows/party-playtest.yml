# Party playtest harness (do not merge): bots play whole games with real timers against a LOCAL Supabase stack.
# Runs only on the playtest branch's pull request (or by hand). No secrets, never the live project.
name: Party playtest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'claude/project-thread-qb76d2-party-playtest'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run 3 already gave a full 4p-3 (with video) and 8p-3; this run repeats the games whose harness hung after
          # game over, plus a second 8-player game.
          - game: 2p-3
          - game: 8p-3
          - game: 4p-1
          - game: 4p-5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pool figures (npm run party-stats)
        run: npm run party-stats
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: supabase start -x studio,imgproxy,vector,logflare,mailpit,supavisor
      - name: Local stack addresses and keys
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY|DB_URL)=' | sed 's/^/export /')"
          {
            echo "PARTY_API_URL=$API_URL"
            echo "PARTY_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "PARTY_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Serve the Edge Functions
        run: |
          echo "ALLOWED_ORIGINS=http://localhost:4173" > "$RUNNER_TEMP/functions.env"
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -H "apikey: $PARTY_ANON_KEY" -o /dev/null -w '%{http_code}' -X POST "$PARTY_API_URL/functions/v1/party" || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1
      - name: Build the site against the local stack
        run: |
          VITE_SUPABASE_URL="$PARTY_API_URL" VITE_SUPABASE_ANON_KEY="$PARTY_ANON_KEY" \
            VITE_TRACK_URL="$PARTY_API_URL/functions/v1/track" npm run build
          if grep -rq 'inxvlunfwsssifvjkgtz' dist/; then echo 'The build points at the live project'; exit 1; fi
      - run: npx playwright install --with-deps chromium
      - name: Play ${{ matrix.game }}
        env:
          PLAYTEST_GAME: ${{ matrix.game }}
          PLAYTEST_VIDEO: ${{ matrix.video || '0' }}
          PLAYTEST_CAP_MIN: '50'
        run: |
          nproc; free -m
          npx playwright test -c playwright.playtest.config.ts
      - name: Summary
        if: always()
        run: cat test-results/playtest/*/summary.txt || true
      - name: Function errors
        if: always()
        run: grep -iE 'error|exception' "$RUNNER_TEMP/serve.log" | tail -50 || true
      # Artifacts can't be downloaded from the agent's sandbox, so the results also go to a throwaway branch per game
      # (orphan, results only; delete after the playtest). Uses the job's own GITHUB_TOKEN, no repository secrets.
      - name: Publish results to a branch
        if: always()
        env:
          RESULTS_BRANCH: claude/project-thread-qb76d2-party-playtest-results-${{ matrix.game }}-r${{ github.run_number }}
        run: |
          [ -d test-results/playtest ] || exit 0
          cp -r test-results/playtest "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Playtest results ${{ matrix.game }} (run ${{ github.run_id }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "results:refs/heads/$RESULTS_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-${{ matrix.game }}
          path: test-results/playtest/
          retention-days: 7
