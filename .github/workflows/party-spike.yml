# Party spike (task 1): measures pg_cron, Realtime and _shared imports on a LOCAL Supabase stack.
# Scratch only; never touches the live project and uses no secrets.
name: Party spike

on:
  pull_request:
    paths:
      - 'supabase/spike/**'
      - '.github/workflows/party-spike.yml'

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: supabase start -x studio,imgproxy,vector,logflare,mailpit,supavisor
      - name: Export local keys
        run: |
          supabase status -o env | sed -E 's/=.*/=<hidden>/'
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"

      - name: 1. pg_cron every second
        run: |
          psql "$DB_URL" -f supabase/spike/cron.sql
          sleep 62
          psql "$DB_URL" -f supabase/spike/cron-report.sql
          psql "$DB_URL" -c "select status, count(*) from cron.job_run_details group by 1"

      - name: 2. Realtime to an anon client
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/spike/realtime.sql
          cd supabase/spike && npm init -y >/dev/null && npm i @supabase/supabase-js@2.119.0 >/dev/null
          node realtime.mjs

      - name: 3. Edge Function imports _shared
        run: |
          cp -r supabase/spike/functions/spike supabase/functions/spike
          cp -r supabase/spike/functions/_shared supabase/functions/_shared
          (supabase functions serve --no-verify-jwt > /tmp/serve.log 2>&1 &)
          for i in $(seq 1 60); do
            out=$(curl -s -m 5 -H "Authorization: Bearer $ANON_KEY" "$API_URL/functions/v1/spike" || true)
            [ "$out" = "hello party from _shared" ] && break
            sleep 2
          done
          echo "function replied: $out"
          tail -20 /tmp/serve.log
          supabase functions deploy --help
          [ "$out" = "hello party from _shared" ]

      - name: Stack images
        if: always()
        run: docker ps --format '{{.Image}}'
